<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Registration</h2>
<form>
    <p class="section-title">Personal Details</p>
    <div class="grid">
        <div>
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name">
        </div>
        <div>
            <label>Date of Birth</label>
            <input type="date">
        </div>
        <div>
            <label>Email</label>
            <input type="email" placeholder="Enter your email">
        </div>

        <div>
            <label>Mobile number</label>
            <input type="tel" placeholder="Enter mobile number">
        </div>
        <div>
            <label>Gender</label>
            <input type="text" placeholder="Enter your gender">
        </div>
        <div>
            <label>Occupation</label>
            <input type="text" placeholder="Enter occupation">
        </div>
    </div>

    <p class="section-title">Identity Details</p>
    <div class="grid">
        <div>
            <label>ID Type</label>
            <input type="text" placeholder="Enter ID type">
        </div>
        <div>
            <label>ID Number</label>
            <input type="text" placeholder="Enter ID number">
        </div>
        <div>
            <label>Issue Authority</label>
            <input type="text" placeholder="Enter issue department">
        </div>

        <div>
            <label>Issue Date</label>
            <input type="date">
        </div>
        <div>
            <label>Issue State</label>
            <input type="text" placeholder="Enter ID issue state">
        </div>
        <div>
            <label>Expiry Date</label>
            <input type="date">
        </div>
    </div>

    <button type="submit" class="btn">Next →</button>
    </form>
</div>

</body>
</html>
